[package]
autotests = false
name = "lumenize-cli"
version.workspace = true
publish.workspace = true
edition = "2024"
authors = ["iadev09 <iadev09@claviron.dev>"]
description = "Standalone Artisan console launcher using Lumenize"
license = "MIT"
repository = "https://github.com/claviron/lumenize.git"
include = ["/src/**", "/README.md", "/LICENSE", "!**/.DS_Store"]
keywords = ["php", "laravel", "artisan", "claviron", "cli"]
categories = ["command-line-utilities"]

# This package is only the executable; reusable APIs live in lumenize.
[features]
default = ["cli"]
cli = ["lumenize/cli"]

[dependencies]
lumenize.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "lumenize"
path = "src/bin/lumenize.rs"
required-features = ["cli"]
