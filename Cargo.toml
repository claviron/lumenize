[package]
autotests = false
name = "lumenize"
version = "0.1.0-alpha.1"
publish = false
edition = "2024"
authors = ["Claviron <code@claviron.org>"]
description = "Safe Atomic Rust Power for PHP/Laravel applications through Claviron and Orbit."
license = "MIT"
readme = "README.md"
repository = "https://github.com/claviron/lumenize.git"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "ARCHITECTURE.md", "AGENTS.md", "LICENSE"]
keywords = ["php", "laravel", "runtime", "claviron", "starter-kit"]
categories = ["web-programming::http-server"]

[features]
default = []
cli = ["dep:clap"]
broadcast = ["claviron/laravel"]

[dependencies]
claviron = { path = "../claviron", default-features = false, features = ["server", "axum", "php_embed"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"], optional = true }
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
tracing = "0.1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
