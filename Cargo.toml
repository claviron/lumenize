[package]
name = "lumenize"
version = "0.2.5"
publish.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
autotests = false
description = "Laravel integration for Claviron hosts, independent of their server boot"
include = ["/src/**", "/tests/**", "/php/src/**", "/php/runners/**", "/php/config/**", "/php/composer.json", "/php/README.md", "/README.md", "/LICENSE", "!**/.DS_Store"]
keywords = ["laravel", "php", "claviron", "octane", "integration"]
categories = ["web-programming::http-server", "api-bindings"]

[features]
default = []
# Independent integration boundaries; neither selects a server composition.
auth = ["claviron/application", "claviron/auth", "claviron-php/auth", "dep:time"]
broadcast = ["dep:claviron-broadcast", "dep:arc-swap", "dep:ext-php-rs", "dep:serde_json"]
edge = ["claviron-broadcast?/edge"]
webtransport = ["claviron-broadcast?/webtransport"]
# One application's PHP owner and socket/Orbit serving composition.
runner = ["claviron-broadcast?/runner", "dep:claviron-runner", "claviron/cache", "claviron-php/cache", "dep:async-trait", "dep:http-body-util", "dep:serde", "dep:serde_json", "dep:serde_yaml", "dep:tower"]
# Artisan command entry; also enables Options::from_args when runner is selected.
cli = ["dep:clap", "claviron-runner?/cli", "tokio/macros", "tokio/rt-multi-thread", "tokio/signal"]
axum = ["claviron/axum", "claviron-runner?/axum"]
tls = ["claviron/tls", "claviron-runner?/tls"]
files = ["runner", "axum", "claviron/files", "claviron-runner/files"]
watch = ["runner", "claviron-runner/watch"]
log = ["claviron/log-pipeline", "claviron-php/log-pipeline"]
log-otlp = ["log", "claviron/log-otlp"]
metrics = ["claviron/metrics", "claviron-php/metrics"]
db = ["claviron/db"]
# Redis cache stores, over the connections the launch's `redis` section declares.
redis = ["claviron/redis"]
postgres = ["db", "claviron/postgres", "claviron-php/postgres"]
mysql = ["db", "claviron/mysql", "claviron-php/mysql"]
sqlite = ["db", "claviron/sqlite", "claviron-php/sqlite"]
legacy-linux = ["claviron/legacy-linux"]

[dependencies]
# The base integration does not select Runner, Edge or Supervisor.
claviron = { workspace = true, features = ["runtime"] }
claviron-runner = { version = "0.2.2", default-features = false, features = ["socket", "orbit", "supervisor"], optional = true }
claviron-broadcast = { workspace = true, optional = true }
claviron-php = { workspace = true, features = ["embed"] }
arc-swap = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
ext-php-rs = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio.workspace = true
tokio-util.workspace = true
tower = { workspace = true, optional = true }

[dev-dependencies]
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
tempfile.workspace = true
# The cache driver's test hosts a real Orbit store and the PHP cache functions.
claviron = { workspace = true, features = ["cache", "orbit"] }
claviron-php = { workspace = true, features = ["cache"] }
tokio = { workspace = true, features = ["macros"] }

[[test]]
name = "cache_store"

[[test]]
name = "native_registration"
required-features = ["broadcast"]

[[test]]
name = "broadcast_provider"
required-features = ["broadcast"]

[workspace]
resolver = "3"
members = ["cli", "examples/laravel"]
default-members = ["."]

[workspace.package]
publish = true
edition = "2024"
license = "MIT"
authors = ["iadev09 <iadev09@claviron.dev>"]
repository = "https://github.com/claviron/lumenize.git"

[workspace.dependencies]
# Public Claviron facade only; framework adapters never become core dependencies.
claviron = { version = "0.2.7", default-features = false }
claviron-broadcast = { version = "0.2.2", default-features = false }
claviron-php = { version = "0.2.4" }
lumenize = { path = ".", version = "0.2.3", default-features = false }
#ext-php-rs v0.16.5 support 8.6.0
ext-php-rs = { version = "0.16.5", default-features = false, features = ["embed", "enum", "observer", "runtime", "smartstring"] }
arc-swap = "1.9"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
