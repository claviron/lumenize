# Run from this application's directory. No Edge or Orbit is needed.
name: laravel-example
fleet_name: lumenize
tcp: 127.0.0.1:8000
orbit: false
workers: 0
request_mode: application
try_files: true
database:
  sqlite:
    example:
      path: database/database.sqlite
      busy_timeout: 100ms
      pool:
        pool_size: 1
        idle_size: 0
        # SQLx's declared pool defaults; separate from SQLite's write-lock wait.
        acquire_timeout: 30s
        idle_timeout: 10m
        max_lifetime: 30m
php:
  engine:
    ini_path: ${PHP_DIR}/etc/php.ini
    ini_scan_dir: ${PHP_DIR}/etc/conf.d/embed
  application:
    script_path: application.php
    env_file: .env
